name: Validate
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.1
        run: sudo apt-get update && sudo apt-get install -y lua5.1
      - name: Check syntax
        run: find QuestWeaver tests -name '*.lua' -exec luac5.1 -p {} \;
      - name: Test planner and adapters
        run: lua5.1 tests/run.lua
      - name: Validate privacy and package
        run: python3 scripts/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: QuestWeaver
          path: dist/QuestWeaver-*.zip
